name: Deploy

# Cloudflare's own Git-connected build system was repeatedly deploying a Worker
# starter instead of this site. Building here and calling wrangler directly
# removes their build pipeline from the equation: what gets deployed is exactly
# what `npm run build` produced in this run.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        # Fail loudly here rather than silently deploying an empty asset
        # directory, which is indistinguishable from a broken deploy in the UI.
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -f dist/404.html   || { echo "dist/404.html missing"; exit 1; }
          echo "Built $(find dist -name '*.html' | wc -l) HTML pages"

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
