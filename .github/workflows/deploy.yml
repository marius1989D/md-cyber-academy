name: Deploy

# Cloudflare's own Git-connected build system was repeatedly deploying a Worker
# starter instead of this site. Building here and calling wrangler directly
# removes their build pipeline from the equation: what gets deployed is exactly
# what `npm run build` produced in this run.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        # Fail loudly here rather than silently deploying an empty asset
        # directory, which is indistinguishable from a broken deploy in the UI.
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -f dist/404.html   || { echo "dist/404.html missing"; exit 1; }
          echo "Built $(find dist -name '*.html' | wc -l) HTML pages"

      - name: Deploy to Cloudflare
        # Deliberately not using cloudflare/wrangler-action: it installs its own
        # copy of wrangler, which is both redundant and a failure point. npm ci
        # has already installed the exact version pinned in package-lock.json,
        # so this deploys with the same wrangler that works locally.
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
